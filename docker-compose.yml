# 生活管理 · docker compose（Next.js 版）
# 默认：SQLite（数据卷持久化）。环境变量集中在 .env（参考 .env.example）
services:
  app:
    build: .
    container_name: life-hub
    restart: unless-stopped
    env_file: .env
    environment:
      # 保持既有部署；本地开发与测试使用公共 PostgreSQL，不在这里复制数据库服务。
      APP_ENV: production
      APP_PROJECT: life_hub
      DB_BACKEND: sqlite
      # SQLite 数据文件固定放数据卷；容器内监听 3000，对外映射 8787
      DB_FILE_NAME: /data/life-hub.db
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
    ports:
      - "8787:3000"
    volumes:
      - life-hub-data:/data

volumes:
  life-hub-data:
