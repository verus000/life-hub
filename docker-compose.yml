# 生活管理 · docker compose（Next.js 版）
# 仅运行应用，数据库由公共基础设施或独立生产实例提供。
services:
  app:
    build: .
    container_name: life-hub
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:?请指定 development、testing 或 production}
      APP_PROJECT: life_hub
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
    ports:
      - "127.0.0.1:${APP_PORT:-8787}:3000"
    networks:
      - database

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:?请指定对应环境的外部数据库网络}
