# 生活管理 · docker compose（Next.js 版）
# 默认：SQLite（数据卷持久化）。环境变量集中在 .env（参考 .env.example）
services:
  app:
    build: .
    container_name: life-hub
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite 数据文件固定放数据卷；容器内监听 3000，对外映射 8787
      DB_FILE_NAME: /data/life-hub.db
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
    ports:
      - "8787:3000"
    volumes:
      - app-data:/data

volumes:
  app-data:
