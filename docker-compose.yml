# 生活管理 · docker compose
# 默认：SQLite（数据卷持久化）。使用外部 PostgreSQL：docker compose --profile postgres up -d
# 环境变量集中在 .env（参考 .env.example），compose 会传入容器。
services:
  app:
    build: .
    image: life-hub
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # SQLite 数据文件固定放数据卷；外部数据库则改 .env 中的 DB_* 并去掉下行注释
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_FILE: /app/data/life-hub.db
    ports:
      - "8787:8787"
    volumes:
      - life-hub-data:/app/data

  # 可选外部数据库示例：docker compose --profile postgres up -d
  # 并在 .env 中设置 DB_TYPE=postgres DB_HOST=postgres DB_PORT=5432 DB_USER=lifehub DB_PASSWORD=... DB_NAME=lifehub
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: change-me-in-env
      POSTGRES_DB: lifehub
    volumes:
      - life-hub-pg:/var/lib/postgresql/data

volumes:
  life-hub-data:
  life-hub-pg:
